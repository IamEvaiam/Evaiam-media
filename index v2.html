<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHELSEA — Univers</title>
<meta name="description" content="Une plateforme où les gens ne se contentent pas de poster : ils construisent leur univers, leurs groupes et leurs projets.">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#08050d;--panel:#110b1d;--panel2:#170d26;--line:#2d1b43;--purple:#8d3dff;--violet:#b85cff;--pink:#ff4bd8;--text:#f8f2ff;--muted:#aa9db9;--soft:#d8cde4;--danger:#ff5f7a;--success:#67e5a1;--shadow:0 20px 70px rgba(0,0,0,.42)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 0%,#26103f 0,transparent 32%),radial-gradient(circle at 100% 15%,#351052 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
.top{position:sticky;top:0;z-index:50;height:70px;background:rgba(8,5,13,.82);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.12em}.panther{width:35px;height:35px;display:grid;place-items:center;border-radius:11px;background:linear-gradient(135deg,#0b0b0d,#28103b);box-shadow:0 0 28px rgba(141,61,255,.3)}.panther svg{width:25px;height:25px;fill:#050507}.nav{display:flex;gap:7px;align-items:center}.nav button,.profile-chip{background:transparent;border:1px solid transparent;color:var(--soft);padding:10px 13px;border-radius:12px}.nav button:hover{background:#1a1027;border-color:var(--line);color:#fff}.profile-chip{display:flex;align-items:center;gap:8px;background:#160d22;border-color:var(--line)}.avatar{width:31px;height:31px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#8d3dff,#ff4bd8);display:grid;place-items:center;font-weight:800}.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;max-width:1500px;margin:auto;min-height:calc(100vh - 70px)}.side{padding:25px 17px;border-right:1px solid var(--line);position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.right{padding:25px 18px;border-left:1px solid var(--line);position:sticky;top:70px;height:calc(100vh - 70px);overflow:auto}.main{padding:30px 34px 80px;min-width:0}.side h4,.right h4{margin:10px 12px;color:#806e93;text-transform:uppercase;letter-spacing:.12em;font-size:11px}.side-item{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:var(--soft);padding:12px;border-radius:13px;text-align:left}.side-item:hover,.side-item.active{background:#1a1028;color:#fff}.side-icon{width:27px;text-align:center}.hero{padding:30px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(141,61,255,.2),rgba(255,75,216,.06) 55%,rgba(17,11,29,.8));box-shadow:var(--shadow);margin-bottom:24px}.hero h1{font-size:clamp(32px,5vw,62px);line-height:.98;margin:8px 0 14px;max-width:800px}.gradient{background:linear-gradient(100deg,#fff,#d8a6ff 45%,#ff5edc);-webkit-background-clip:text;background-clip:text;color:transparent}.eyebrow{font-size:12px;color:#c77dff;text-transform:uppercase;letter-spacing:.18em;font-weight:800}.hero p{color:var(--soft);max-width:720px;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#160d22;color:#fff;padding:11px 15px;border-radius:12px;font-weight:700}.btn:hover{border-color:#6b39a0;transform:translateY(-1px)}.btn.primary{border:0;background:linear-gradient(135deg,var(--purple),#d84eff);box-shadow:0 10px 35px rgba(141,61,255,.25)}.btn.ghost{background:transparent}.btn.danger{color:#ff9caf}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{border:1px solid var(--line);background:rgba(17,11,29,.88);border-radius:18px;padding:19px}.card:hover{border-color:#50316e}.card h3{margin:0 0 8px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px}.section-title h2{margin:0;font-size:20px}.pill{display:inline-flex;padding:6px 9px;border-radius:999px;background:#251437;color:#d8b8f7;font-size:11px;font-weight:800}.post{margin-bottom:15px}.post-head{display:flex;gap:10px;align-items:center}.post-head strong{font-size:14px}.post-title{font-size:21px;margin:13px 0 8px}.post-body{color:#d4c9df;line-height:1.65;white-space:pre-wrap}.post-meta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.post-meta button{border:1px solid var(--line);background:#0e0916;color:#bbaec7;border-radius:9px;padding:7px 9px}.post-meta button:hover{color:#fff;border-color:#5b3c78}.profile-cover{height:170px;border-radius:22px;background:radial-gradient(circle at 70% 30%,rgba(255,75,216,.5),transparent 30%),linear-gradient(135deg,#321151,#0c0712);border:1px solid var(--line);position:relative;overflow:hidden}.profile-cover:after{content:"";position:absolute;width:380px;height:380px;border:1px solid rgba(216,166,255,.18);border-radius:50%;right:-100px;top:-150px}.profile-card{margin-top:-48px;position:relative;padding:0 25px 25px}.profile-big{width:94px;height:94px;border:5px solid var(--bg);font-size:30px}.statrow{display:flex;gap:24px;margin-top:16px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.input,.textarea,.select{width:100%;background:#0c0711;border:1px solid #352248;color:#fff;border-radius:11px;padding:12px 13px;outline:none}.textarea{min-height:130px;resize:vertical}.input:focus,.textarea:focus,.select:focus{border-color:#8847bd;box-shadow:0 0 0 3px rgba(141,61,255,.12)}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#b7a8c3;margin-bottom:7px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:100;display:grid;place-items:center;padding:20px}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#10091a;border:1px solid #4b2b68;border-radius:22px;padding:24px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close{background:transparent;border:0;color:#b9a7c5;font-size:24px}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}.tab{border:0;background:transparent;color:#9e90aa;padding:11px 13px;border-bottom:2px solid transparent}.tab.active{color:#fff;border-color:#b85cff}.empty{padding:35px;text-align:center;border:1px dashed #3a2650;border-radius:18px;color:#9e90aa}.toast{position:fixed;bottom:22px;right:22px;background:#171021;border:1px solid #5a3978;padding:13px 16px;border-radius:12px;z-index:200;box-shadow:var(--shadow)}.right-card{border:1px solid var(--line);background:#10091a;border-radius:17px;padding:16px;margin-bottom:12px}.member{display:flex;align-items:center;gap:9px;margin:10px 0}.member .avatar{width:35px;height:35px}.link{color:#d69aff;text-decoration:none}.universe-card{min-height:150px;position:relative;overflow:hidden}.universe-card .orb{position:absolute;width:150px;height:150px;border-radius:50%;right:-45px;top:-45px;background:radial-gradient(circle,#c55cff,transparent 65%);opacity:.45}.project-status{font-size:11px;color:#d9baff;text-transform:uppercase;letter-spacing:.1em}.mobile-nav{display:none}
@media(max-width:1100px){.layout{grid-template-columns:210px minmax(0,1fr)}.right{display:none}.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.top{padding:0 15px}.nav button{display:none}.layout{display:block}.side{display:none}.main{padding:18px 14px 90px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(12,7,18,.95);border-top:1px solid var(--line);justify-content:space-around;padding:8px}.mobile-nav button{border:0;background:transparent;color:#aa9db9;font-size:11px}.mobile-nav button.active{color:#fff}.grid,.grid3,.form-grid{grid-template-columns:1fr}.hero{padding:22px}.hero h1{font-size:38px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="panther"><svg viewBox="0 0 64 64"><path d="M11 43c7-1 9-7 11-14l-4-9 8 3c6-5 14-7 23-3l5-5 1 9c5 5 7 11 4 17-3 6-9 9-18 9H25c-7 0-11-2-14-7zm18-8c2 2 5 3 8 3 5 0 8-2 11-5-4 1-7 0-10-2-3-2-6-1-9 4z"/></svg></span><span>CHELSEA</span></div>
  <nav class="nav" id="topNav"></nav>
</header>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://bplspbmzzehtdmhehjkt.supabase.co';
const SUPABASE_KEY='sb_publishable_SvCH0QC8erupiu5erZ1a4g_ucAU1X7P';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let state={user:null,profile:null,universe:null,universes:[],groups:[],projects:[],posts:[],view:'home',loading:false};
const $=id=>document.getElementById(id);
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function avatar(p,size=''){if(p?.avatar_url)return `<img class="avatar ${size}" src="${esc(p.avatar_url)}" alt="">`;return `<span class="avatar ${size}">${esc((p?.display_name||p?.username||'?').slice(0,1).toUpperCase())}</span>`}
function openModal(html){$('modal').innerHTML=`<div class="modal-box">${html}</div>`;$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function nav(){
 const n=$('topNav');
 if(!state.user){n.innerHTML=`<button onclick="openAuth('login')">Se connecter</button><button class="btn primary" onclick="openAuth('signup')">Créer mon compte</button>`;return}
 n.innerHTML=`<button onclick="go('discover')">Découvrir</button><button onclick="go('dashboard')">Créer</button><button class="profile-chip" onclick="go('profile')">${avatar(state.profile)} ${esc(state.profile?.display_name||state.profile?.username||'Mon profil')}</button>`;
}
function shell(content){return `<div class="layout"><aside class="side"><h4>Mon espace</h4><button class="side-item ${state.view==='home'?'active':''}" onclick="go('home')"><span class="side-icon">⌂</span>Accueil</button><button class="side-item ${state.view==='dashboard'?'active':''}" onclick="go('dashboard')"><span class="side-icon">✦</span>Mon cockpit</button><button class="side-item ${state.view==='profile'?'active':''}" onclick="go('profile')"><span class="side-icon">◉</span>Mon profil</button><button class="side-item ${state.view==='universe'?'active':''}" onclick="go('universe')"><span class="side-icon">◈</span>Mon univers</button><h4>Créer</h4><button class="side-item" onclick="openCreatePost()"><span class="side-icon">＋</span>Publier</button><button class="side-item" onclick="openCreateProject()"><span class="side-icon">⌁</span>Projet</button><button class="side-item" onclick="openCreateGroup()"><span class="side-icon">◎</span>Groupe</button><h4>Explorer</h4><button class="side-item ${state.view==='discover'?'active':''}" onclick="go('discover')"><span class="side-icon">✧</span>Univers publics</button><button class="side-item" onclick="go('projects')"><span class="side-icon">◇</span>Projets</button><div style="height:30px"></div><button class="side-item" onclick="signOut()"><span class="side-icon">↪</span>Déconnexion</button></aside><main class="main">${content}</main><aside class="right">${rightRail()}</aside></div><nav class="mobile-nav"><button onclick="go('home')">⌂<br>Accueil</button><button onclick="go('discover')">✧<br>Découvrir</button><button onclick="openCreatePost()">＋<br>Publier</button><button onclick="go('dashboard')">✦<br>Cockpit</button><button onclick="go('profile')">◉<br>Profil</button></nav>`}
function rightRail(){if(!state.user)return '';return `<div class="right-card"><div class="eyebrow">L'idée</div><h3 style="margin:7px 0">Pas un feed. Un monde.</h3><p class="muted" style="line-height:1.5;font-size:13px">Chaque personne possède un univers. Chaque univers peut accueillir des groupes, des projets et des créations.</p></div><div class="right-card"><h4 style="margin:0 0 8px">Mon univers</h4>${state.universe?`<strong>${esc(state.universe.name)}</strong><p class="muted">${esc(state.universe.description||'Ton espace à toi.')}</p><button class="btn" onclick="copyInvite()">Inviter des gens</button>`:`<button class="btn primary" onclick="createUniverse()">Créer mon univers</button>`}</div><div class="right-card"><h4 style="margin:0 0 8px">Mes projets</h4>${state.projects.slice(0,3).map(p=>`<div class="member"><span class="avatar">⌁</span><div><b>${esc(p.title)}</b><div class="muted" style="font-size:11px">${esc(p.status)}</div></div></div>`).join('')||'<span class="muted">Aucun projet pour le moment.</span>'}</div>`}
async function loadUser(){const {data:{user}}=await sb.auth.getUser();state.user=user||null;if(user){await loadProfile();await loadUniverse();await loadMyStuff();await loadFeed()}else{renderPublic()}nav()}
async function loadProfile(){const {data}=await sb.from('profiles').select('*').eq('id',state.user.id).maybeSingle();state.profile=data||{id:state.user.id,display_name:state.user.user_metadata?.display_name||'',username:state.user.user_metadata?.username||'',bio:''}}
async function loadUniverse(){let {data}=await sb.from('universes').select('*').eq('owner_id',state.user.id).order('created_at').limit(1).maybeSingle();state.universe=data||null}
async function loadMyStuff(){let g=state.universe?await sb.from('groups').select('*').eq('universe_id',state.universe.id).order('created_at',{ascending:false}):{data:[]};state.groups=g.data||[];let p=state.universe?await sb.from('projects').select('*').eq('universe_id',state.universe.id).order('created_at',{ascending:false}):{data:[]};state.projects=p.data||[]}
async function loadFeed(){const {data}=await sb.from('posts').select('*').eq('published',true).eq('visibility','public').order('published_at',{ascending:false}).limit(20);state.posts=data||[]}
async function go(view){state.view=view;window.location.hash=view;await render();}
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1)||'home';state.view=v;render()});
async function render(){nav();if(!state.user){renderPublic();return}await loadUserDataForView();let c='';if(state.view==='profile')c=profileView();else if(state.view==='dashboard')c=dashboardView();else if(state.view==='universe')c=universeView();else if(state.view==='discover')c=discoverView();else if(state.view==='projects')c=projectsView();else c=homeView();$('app').innerHTML=shell(c)}
async function loadUserDataForView(){if(state.view==='home'||state.view==='discover'||state.view==='projects')await loadFeed()}
function homeView(){return `<section class="hero"><div class="eyebrow">Ton espace social</div><h1>Construis <span class="gradient">ton univers.</span></h1><p>Ici, tu ne viens pas seulement poster. Tu construis un monde à ton image, tu réunis des gens, tu lances des projets et tu fais vivre des idées.</p><div class="actions"><button class="btn primary" onclick="openCreatePost()">＋ Publier quelque chose</button><button class="btn" onclick="go('universe')">Entrer dans mon univers</button></div></section><div class="section-title"><h2>Le flux</h2><span class="pill">PUBLIC</span></div>${state.posts.length?state.posts.map(postCard).join(''):`<div class="empty">Ton flux est encore vide. <button class="btn primary" onclick="openCreatePost()">Publie la première chose</button></div>`}`}
function dashboardView(){return `<section class="hero"><div class="eyebrow">Mon cockpit</div><h1>Tout ce que tu <span class="gradient">construis.</span></h1><p>Ton profil, ton univers, tes groupes et tes projets sont réunis ici. Pas besoin de passer par dix applications.</p><div class="actions"><button class="btn primary" onclick="openCreatePost()">Publier</button><button class="btn" onclick="openCreateProject()">Nouveau projet</button><button class="btn" onclick="openCreateGroup()">Nouveau groupe</button></div></section><div class="grid grid3"><div class="card"><span class="pill">UNIVERS</span><h3>${esc(state.universe?.name||'Mon univers')}</h3><p class="muted">${esc(state.universe?.description||'Crée ton univers.')}</p></div><div class="card"><span class="pill">GROUPES</span><h3>${state.groups.length}</h3><p class="muted">Espaces que tu as créés.</p></div><div class="card"><span class="pill">PROJETS</span><h3>${state.projects.length}</h3><p class="muted">Idées en construction.</p></div></div><div class="section-title"><h2>Mes créations</h2></div>${state.posts.filter(p=>p.author_id===state.user.id).map(postCard).join('')||'<div class="empty">Tu n’as encore rien publié.</div>'}`}
function profileView(){return `<div class="profile-cover"></div><section class="profile-card"><div>${avatar(state.profile,'profile-big')}</div><div style="margin-top:10px"><h1 style="margin:0">${esc(state.profile?.display_name||state.profile?.username||'Sans nom')}</h1><div class="muted">@${esc(state.profile?.username||'membre')}</div><p style="max-width:650px;line-height:1.6">${esc(state.profile?.bio||'Ajoute une bio pour dire aux gens qui tu es.')}</p><div class="actions"><button class="btn primary" onclick="openEditProfile()">Modifier mon profil</button><button class="btn" onclick="copyProfileLink()">Partager mon profil</button></div></div><div class="statrow"><div class="stat"><b>${state.posts.filter(p=>p.author_id===state.user.id).length}</b><span>publications</span></div><div class="stat"><b>${state.groups.length}</b><span>groupes</span></div><div class="stat"><b>${state.projects.length}</b><span>projets</span></div></div></section><div class="section-title"><h2>Mes publications</h2></div>${state.posts.filter(p=>p.author_id===state.user.id).map(postCard).join('')||'<div class="empty">Aucune publication.</div>'}`}
function universeView(){return `<section class="hero"><div class="eyebrow">Mon univers</div><h1>${esc(state.universe?.name||'Mon univers')}</h1><p>${esc(state.universe?.description||'Ton espace personnel.')}</p><div class="actions"><button class="btn primary" onclick="openEditUniverse()">Personnaliser</button><button class="btn" onclick="copyInvite()">Inviter</button><button class="btn" onclick="openCreateProject()">＋ Projet</button><button class="btn" onclick="openCreateGroup()">＋ Groupe</button></div></section><div class="section-title"><h2>Mes groupes</h2></div><div class="grid">${state.groups.map(g=>`<div class="card"><span class="pill">GROUPE</span><h3>${esc(g.name)}</h3><p class="muted">${esc(g.description||'')}</p><button class="btn" onclick="joinGroup(${g.id})">Rejoindre / ouvrir</button></div>`).join('')||'<div class="empty">Crée ton premier groupe.</div>'}</div><div class="section-title"><h2>Mes projets</h2></div><div class="grid">${state.projects.map(projectCard).join('')||'<div class="empty">Crée un projet à construire avec d’autres.</div>'}</div>`}
function discoverView(){return `<section class="hero"><div class="eyebrow">Découvrir</div><h1>Des <span class="gradient">univers</span>, pas des comptes.</h1><p>Découvre ce que les autres construisent et rejoins les mondes qui t’intéressent.</p></section><div id="discoverList" class="grid"></div>`}
async function fillDiscover(){const {data}=await sb.from('universes').select('*').eq('is_public',true).order('created_at',{ascending:false}).limit(30);$('discoverList').innerHTML=(data||[]).map(u=>`<div class="card universe-card"><div class="orb"></div><span class="pill">UNIVERS</span><h3>${esc(u.name)}</h3><p class="muted">${esc(u.description||'')}</p><button class="btn primary" onclick="joinUniverse(${u.id})">Rejoindre</button></div>`).join('')||'<div class="empty">Aucun univers public pour le moment.</div>'}
function projectsView(){return `<section class="hero"><div class="eyebrow">Projets</div><h1>Les idées qui <span class="gradient">prennent vie.</span></h1><p>Un projet est un objet social : tu peux le lancer, recruter des membres et publier son avancement.</p><button class="btn primary" onclick="openCreateProject()">＋ Créer un projet</button></section><div class="grid">${state.projects.map(projectCard).join('')||'<div class="empty">Ton univers n’a encore aucun projet.</div>'}</div>`}
function projectCard(p){return `<div class="card"><div class="project-status">${esc(p.status)}</div><h3>${esc(p.title)}</h3><p class="muted">${esc(p.description||'')}</p><button class="btn" onclick="openProject(${p.id})">Ouvrir le projet</button></div>`}
function postCard(p){return `<article class="card post"><div class="post-head">${avatar(state.profile)}<div><strong>${p.author_id===state.user.id?'Toi':'Membre'}</strong><div class="muted" style="font-size:11px">${new Date(p.published_at||p.created_at).toLocaleDateString('fr-FR')} · ${esc(p.content_type||'article')}</div></div></div><h3 class="post-title">${esc(p.title)}</h3>${p.excerpt?`<p class="muted">${esc(p.excerpt)}</p>`:''}<div class="post-body">${esc(p.content||'')}</div><div class="post-meta"><button onclick="toggleLike(${p.id},this)">♡ J’aime</button><button onclick="commentPost(${p.id})">◌ Commenter</button><button onclick="savePost(${p.id},this)">☆ Enregistrer</button></div></article>`}
function openAuth(mode='login'){openModal(`<div class="modal-head"><div><div class="eyebrow">CHELSEA</div><h2 style="margin:4px 0">${mode==='login'?'Ravi de te revoir.':'Crée ton univers.'}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="tabs"><button class="tab ${mode==='login'?'active':''}" onclick="openAuth('login')">Se connecter</button><button class="tab ${mode==='signup'?'active':''}" onclick="openAuth('signup')">Créer un compte</button></div>${mode==='signup'?`<div class="form-grid"><div class="field"><label>Nom affiché</label><input class="input" id="authName" placeholder="Chelsea"></div><div class="field"><label>Pseudo</label><input class="input" id="authUsername" placeholder="chelseawho"></div></div>`:''}<div class="field"><label>Email</label><input class="input" id="authEmail" type="email" placeholder="toi@email.com"></div><div class="field"><label>Mot de passe</label><input class="input" id="authPassword" type="password" placeholder="••••••••"></div><button class="btn primary" style="width:100%" onclick="${mode==='login'?'login()':'signup()'}">${mode==='login'?'Se connecter':'Créer mon compte'}</button>${mode==='login'?`<button class="btn ghost" style="width:100%;margin-top:8px" onclick="resetPassword()">Mot de passe oublié ?</button>`:''}<p class="muted" id="authMsg" style="font-size:12px"></p>`)}
async function signup(){const email=$('authEmail').value.trim(),password=$('authPassword').value,name=$('authName').value.trim(),username=$('authUsername').value.trim().toLowerCase();if(password.length<6){$('authMsg').textContent='Le mot de passe doit faire au moins 6 caractères.';return}const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name,username},emailRedirectTo:location.origin}});if(error){$('authMsg').textContent=error.message;return}if(data.session){closeModal();toast('Compte créé. Bienvenue.');await loadUser();await render()}else{$('authMsg').textContent='Compte créé. Vérifie ton email puis reviens ici pour te connecter.'}}
async function login(){const email=$('authEmail').value.trim(),password=$('authPassword').value;const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){$('authMsg').textContent=error.message;return}closeModal();toast('Connexion réussie.');state.user=data.user;await loadUser();state.view='home';await render()}
async function resetPassword(){const email=$('authEmail').value.trim();if(!email){$('authMsg').textContent='Entre ton email d’abord.';return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});$('authMsg').textContent=error?error.message:'Email de réinitialisation envoyé.'}
async function signOut(){await sb.auth.signOut({scope:'local'});state.user=null;state.profile=null;state.universe=null;state.posts=[];location.hash='home';renderPublic();nav();toast('Tu es déconnecté.')}
function renderPublic(){$('app').innerHTML=`<main style="max-width:1200px;margin:auto;padding:60px 22px 90px"><section class="hero" style="min-height:620px;display:flex;flex-direction:column;justify-content:center"><div class="eyebrow">CHELSEA / UNIVERS</div><h1>Les réseaux sociaux te montrent des gens.<br><span class="gradient">Nous voulons te montrer ce qu’ils construisent.</span></h1><p>Une plateforme violette où chacun possède son univers, publie ce qu’il veut, crée des groupes, lance des projets et invite les bonnes personnes à entrer dans son monde.</p><div class="actions"><button class="btn primary" onclick="openAuth('signup')">Créer mon univers</button><button class="btn" onclick="openAuth('login')">J’ai déjà un compte</button></div><div style="margin-top:40px" class="grid grid3"><div class="card"><span class="pill">UNIVERS</span><h3>Ton monde</h3><p class="muted">Un espace qui t’appartient, pas juste un profil.</p></div><div class="card"><span class="pill">PROJETS</span><h3>Construis à plusieurs</h3><p class="muted">Transforme une idée en projet et invite des collaborateurs.</p></div><div class="card"><span class="pill">GROUPES</span><h3>Rassemble les tiens</h3><p class="muted">Crée des petits espaces autour de centres d’intérêt précis.</p></div></div></section></main>`}
async function openEditProfile(){openModal(`<div class="modal-head"><h2>Mon profil</h2><button class="close" onclick="closeModal()">×</button></div><div style="display:flex;align-items:center;gap:15px;margin-bottom:20px">${avatar(state.profile,'profile-big')}<div><b>Photo de profil</b><p class="muted" style="margin:4px 0;font-size:12px">PNG/JPG · 2 Mo max</p><input id="avatarFile" type="file" accept="image/*" class="input"></div></div><div class="field"><label>Nom affiché</label><input class="input" id="profileName" value="${esc(state.profile?.display_name||'')}"></div><div class="field"><label>Pseudo</label><input class="input" id="profileUsername" value="${esc(state.profile?.username||'')}"></div><div class="field"><label>Bio</label><textarea class="textarea" id="profileBio">${esc(state.profile?.bio||'')}</textarea></div><button class="btn primary" style="width:100%" onclick="saveProfile()">Enregistrer</button>`)}
async function saveProfile(){let avatar_url=state.profile?.avatar_url||null;const f=$('avatarFile').files[0];if(f){const ext=f.name.split('.').pop().toLowerCase();const path=`${state.user.id}/avatar-${Date.now()}.${ext}`;const {error}=await sb.storage.from('avatars').upload(path,f,{upsert:true,contentType:f.type});if(error){toast(error.message);return}avatar_url=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl}const updates={id:state.user.id,display_name:$('profileName').value.trim(),username:$('profileUsername').value.trim().toLowerCase(),bio:$('profileBio').value.trim(),avatar_url};const {error}=await sb.from('profiles').upsert(updates);if(error){toast(error.message);return}state.profile={...state.profile,...updates};closeModal();nav();await render();toast('Profil mis à jour.')}
function openEditUniverse(){openModal(`<div class="modal-head"><h2>Personnaliser mon univers</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Nom</label><input class="input" id="uName" value="${esc(state.universe?.name||'Mon univers')}"></div><div class="field"><label>Description</label><textarea class="textarea" id="uDesc">${esc(state.universe?.description||'')}</textarea></div><button class="btn primary" style="width:100%" onclick="saveUniverse()">Enregistrer</button>`)}
async function createUniverse(){if(state.universe){go('universe');return}openModal(`<div class="modal-head"><h2>Créer mon univers</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Nom</label><input class="input" id="uName" placeholder="Mon univers"></div><div class="field"><label>Description</label><textarea class="textarea" id="uDesc" placeholder="Ce que les gens vont trouver ici..."></textarea></div><button class="btn primary" style="width:100%" onclick="saveUniverse(true)">Créer</button>`)}
async function saveUniverse(create=false){const name=$('uName').value.trim(),description=$('uDesc').value.trim();if(!name)return toast('Donne un nom à ton univers.');let slug=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+state.user.id.slice(0,8);let res;if(create)res=await sb.from('universes').insert({owner_id:state.user.id,name,slug,description}).select().single();else res=await sb.from('universes').update({name,description,updated_at:new Date().toISOString()}).eq('id',state.universe.id).select().single();if(res.error){toast(res.error.message);return}state.universe=res.data;closeModal();await render();toast(create?'Univers créé.':'Univers mis à jour.')}
function openCreatePost(){if(!state.user)return openAuth('signup');if(!state.universe)return toast('Crée ton univers d’abord.');openModal(`<div class="modal-head"><h2>Publier</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Type</label><select class="select" id="postType"><option value="article">Article / texte</option><option value="idea">Idée</option><option value="podcast">Podcast</option><option value="video">Vidéo</option><option value="book">Recommandation</option></select></div><div class="field"><label>Titre</label><input class="input" id="postTitle" placeholder="Qu’est-ce que tu veux partager ?"></div><div class="field"><label>Texte</label><textarea class="textarea" id="postContent" placeholder="Écris quelque chose..."></textarea></div><div class="field"><label>Visibilité</label><select class="select" id="postVisibility"><option value="public">Public</option><option value="universe">Mon univers</option><option value="project">Un projet</option></select></div><div id="projectSelect" class="field hidden"><label>Projet</label><select class="select" id="postProject">${state.projects.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></div><button class="btn primary" style="width:100%" onclick="publishPost()">Publier</button>`);$('postVisibility').addEventListener('change',()=>$('projectSelect').classList.toggle('hidden',$('postVisibility').value!=='project'))}
async function publishPost(){const title=$('postTitle').value.trim(),content=$('postContent').value.trim(),visibility=$('postVisibility').value;let project_id=visibility==='project'?Number($('postProject').value):null;if(!title||!content)return toast('Il faut un titre et du contenu.');const row={author_id:state.user.id,title,slug:title.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now(),excerpt:content.slice(0,160),content,content_type:$('postType').value,published:true,published_at:new Date().toISOString(),universe_id:state.universe.id,project_id,visibility};const {error}=await sb.from('posts').insert(row);if(error){toast(error.message);return}closeModal();await loadFeed();await render();toast('Publication en ligne.')}
function openCreateGroup(){if(!state.universe)return toast('Crée ton univers d’abord.');openModal(`<div class="modal-head"><h2>Nouveau groupe</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Nom</label><input class="input" id="gName" placeholder="Ex. Les créatifs"></div><div class="field"><label>Description</label><textarea class="textarea" id="gDesc" placeholder="À quoi sert ce groupe ?"></textarea></div><button class="btn primary" style="width:100%" onclick="createGroup()">Créer le groupe</button>`)}
async function createGroup(){const name=$('gName').value.trim(),description=$('gDesc').value.trim();const {data,error}=await sb.from('groups').insert({universe_id:state.universe.id,owner_id:state.user.id,name,description,is_public:true}).select().single();if(error){toast(error.message);return}await sb.from('group_members').insert({group_id:data.id,user_id:state.user.id,role:'owner'});state.groups.unshift(data);closeModal();await render();toast('Groupe créé.')}
async function joinGroup(id){const {error}=await sb.from('group_members').upsert({group_id:id,user_id:state.user.id,role:'member'});toast(error?error.message:'Tu as rejoint le groupe.')} 
function openCreateProject(){if(!state.universe)return toast('Crée ton univers d’abord.');openModal(`<div class="modal-head"><h2>Nouveau projet</h2><button class="close" onclick="closeModal()">×</button></div><div class="field"><label>Nom du projet</label><input class="input" id="pTitle" placeholder="Ex. Mon podcast"></div><div class="field"><label>Description</label><textarea class="textarea" id="pDesc" placeholder="Que voulez-vous construire ?"></textarea></div><div class="field"><label>Statut</label><select class="select" id="pStatus"><option value="idea">Idée</option><option value="building">En construction</option><option value="active">Actif</option></select></div><button class="btn primary" style="width:100%" onclick="createProject()">Créer le projet</button>`)}
async function createProject(){const title=$('pTitle').value.trim(),description=$('pDesc').value.trim(),status=$('pStatus').value;const {data,error}=await sb.from('projects').insert({universe_id:state.universe.id,owner_id:state.user.id,title,description,status}).select().single();if(error){toast(error.message);return}await sb.from('project_members').insert({project_id:data.id,user_id:state.user.id,role:'owner'});state.projects.unshift(data);closeModal();await render();toast('Projet créé.')}
async function openProject(id){const p=state.projects.find(x=>x.id===id);if(!p)return;const {data:posts}=await sb.from('posts').select('*').eq('project_id',id).eq('published',true).order('published_at',{ascending:false});openModal(`<div class="modal-head"><div><div class="project-status">${esc(p.status)}</div><h2 style="margin:4px 0">${esc(p.title)}</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="muted">${esc(p.description||'')}</p><button class="btn primary" onclick="openCreatePost();closeModal()">＋ Publier dans ce projet</button><div class="section-title"><h2>Avancement</h2></div>${(posts||[]).map(postCard).join('')||'<div class="empty">Pas encore de publication.</div>'}`)}
async function joinUniverse(id){const {data:u}=await sb.from('universes').select('*').eq('id',id).single();if(!u)return;const {error}=await sb.from('universe_members').upsert({universe_id:id,user_id:state.user.id,role:'member'});if(error){toast(error.message);return}toast(`Bienvenue dans ${u.name}.`)}
async function copyInvite(){if(!state.universe)return;const url=location.origin+location.pathname+'#universe-'+state.universe.slug;navigator.clipboard?.writeText(url);toast('Lien d’invitation copié.')}function copyProfileLink(){const url=location.origin+location.pathname+'#profile-'+(state.profile?.username||state.user.id);navigator.clipboard?.writeText(url);toast('Lien de profil copié.')}
async function toggleLike(id,btn){if(!state.user)return openAuth('login');const {data}=await sb.from('likes').select('post_id').eq('post_id',id).eq('user_id',state.user.id).maybeSingle();if(data){await sb.from('likes').delete().eq('post_id',id).eq('user_id',state.user.id);btn.textContent='♡ J’aime'}else{await sb.from('likes').insert({post_id:id,user_id:state.user.id});btn.textContent='♥ J’aime'}}
async function savePost(id,btn){if(!state.user)return openAuth('login');const {data}=await sb.from('bookmarks').select('post_id').eq('post_id',id).eq('user_id',state.user.id).maybeSingle();if(data){await sb.from('bookmarks').delete().eq('post_id',id).eq('user_id',state.user.id);btn.textContent='☆ Enregistrer'}else{await sb.from('bookmarks').insert({post_id:id,user_id:state.user.id});btn.textContent='★ Enregistré'}}
async function commentPost(id){const body=prompt('Ton commentaire :');if(!body)return;const {error}=await sb.from('comments').insert({post_id:id,user_id:state.user.id,body});toast(error?error.message:'Commentaire publié.')}
sb.auth.onAuthStateChange(async(event,session)=>{state.user=session?.user||null;if(state.user){await loadUser();if(!state.view||state.view==='home')state.view='home';await render()}else{renderPublic();nav()}});
(async()=>{const v=location.hash.slice(1);if(v.startsWith('universe-'))state.view='discover';else if(v.startsWith('profile-'))state.view='discover';else state.view=v||'home';await loadUser();if(state.user)await render();if(state.view==='discover'&&state.user)await fillDiscover()})();
const _render=render;render=async function(){await _render();if(state.view==='discover'&&state.user)await fillDiscover()}
</script>
</body></html>
